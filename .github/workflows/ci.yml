name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\PES2017Editor.sln --nologo
      - name: Build Release
        run: dotnet build .\PES2017Editor.sln -c Release --no-restore --nologo
      - name: Testes automatizados
        run: dotnet test .\PES2017Editor.sln -c Release --no-restore --nologo --filter "Category!=Proprietary" --logger "trx;LogFileName=tests.trx"
      - name: Auditoria de vulnerabilidades NuGet
        continue-on-error: true
        run: dotnet list .\PES2017Editor.sln package --vulnerable --include-transitive
      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
