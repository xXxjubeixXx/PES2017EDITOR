name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar uma release (use somente para uma tag nova)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Preparar artefatos
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ startsWith(github.ref_name, 'v0.3.0') && 'experimental' || 'stable' }}
        run: .\scripts\release.ps1 -PrepareOnly -PublicOnly -Channel $env:RELEASE_CHANNEL
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push' || inputs.publish == true
        run: |
          $version = '${{ github.ref_name }}'
          $root = "artifacts/release/$($version.TrimStart('v'))"
          $installer = "artifacts/installer/PES2017DatabaseEditor-Setup-$version-win-x64.exe"
          $portable = Join-Path $root "PES2017DatabaseEditor-Portable-$version-win-x64.zip"
          $args = @('release', 'create', $version, $installer, $portable, (Join-Path $root 'SHA256SUMS.txt'), (Join-Path $root 'update-manifest.json'), '--repo', 'xXxjubeixXx/PES2017EDITOR', '--title', "PES 2017 Database Editor $version", '--notes-file', 'docs/PHASE_03_REPORT.md')
          if ($version -eq 'v0.3.0') { $args += '--prerelease' }
          gh @args
